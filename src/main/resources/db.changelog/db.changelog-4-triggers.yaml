databaseChangeLog:
  - changeSet:
      id: 4
      author: Nikita
      comment: Create audit functions
      changes:
        - sqlFile:
            path: db.changelog/sql/Auditing.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: true
      rollback:
        - sqlFile:
            path: db.changelog/sql/DropFunction.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 4.1
      author: Nikita
      comment: Create triggers
      changes:
        - sqlFile:
            path: db.changelog/sql/CreateTrigger.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: true
      rollback:
        - sqlFile:
            path: db.changelog/sql/DropTriggers.sql
            relativeToChangelogFile: false
            splitStatements: true
            stripComments: true